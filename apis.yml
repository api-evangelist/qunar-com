name: Qunar Com
description: >-
  Qunar (去哪儿网, "where to go") is a Chinese online travel platform founded in
  2005 and headquartered in Beijing. It operates a travel search and booking
  service covering domestic and international flight tickets, hotel
  reservations, train and bus tickets, vacation packages, and travel deals.
  Qunar was NASDAQ-listed (QUNR) and is majority owned by Trip.com Group
  (formerly Ctrip). It was surfaced as a portfolio company of Mayfield and
  added to the API Evangelist network as a stub for enrichment; no public
  developer portal or API program was discoverable at open.qunar.com,
  developer.qunar.com, or api.qunar.com during this enrichment pass.
